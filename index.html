<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#272e35">
  <meta name="description" content="Build and share a Counter-Strike 2 crosshair, or unseal a random one from the Series 1 Case.">
  <title>CS2 Crosshair Generator</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/saira-condensed-medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="util">
      <a class="util-btn" href="#editor" data-page="editor" aria-current="page" aria-label="Crosshair generator"><i data-icon="home" data-size="24"></i></a>
      <button type="button" class="util-btn" id="sound" aria-label="Toggle sound"></button>
      <button type="button" class="util-btn" data-about aria-label="How it works"><i data-icon="info" data-size="23"></i></button>
    </div>
    <nav class="main-nav" aria-label="Main">
      <a href="#editor" data-page="editor" aria-current="page">Generator</a>
      <a href="#case" data-page="case">Case</a>
      <button type="button" id="inventory"><i data-icon="inventory" data-size="20" class="inventory-ico"></i><span class="inventory-word">Inventory</span><span class="counter" id="inventory-count">00</span></button>
    </nav>
    <div class="util"></div>
  </header>
  <main class="shell" id="main" tabindex="-1">
    <noscript><p class="noscript">Enable JavaScript to edit crosshairs and open cases.</p></noscript>

    <section id="editor-page" class="page editor-page" aria-labelledby="editor-title">
      <h1 class="sr-only" id="editor-title">Crosshair generator</h1>
      <div class="band">
        <div class="band-inner">
          <div class="band-search" role="search">
            <button type="button" class="search-btn" id="search-toggle" aria-expanded="false" aria-controls="settings-search" aria-label="Search settings"><i data-icon="search" data-size="22"></i></button>
            <input type="search" id="settings-search" placeholder="Search settings" aria-label="Search settings" autocomplete="off" spellcheck="false" hidden>
          </div>
          <nav class="tabs" id="groups" aria-label="Settings sections"></nav>
        </div>
      </div>
      <div class="runway">
        <div class="preview-dock">
          <div class="preview">
            <div class="viewport" id="viewport">
              <img id="map-image" class="map-image" src="./assets/maps/dust2.webp" alt="Dust II crosshair preview" fetchpriority="high">
              <button type="button" id="fire-area" class="fire-area" aria-label="Test fire preview; hold the mouse, Space, or Enter"></button>
              <svg id="aim" class="aim" width="2" height="2" viewBox="-1 -1 2 2" aria-hidden="true"></svg>
            </div>
            <div class="view-ui">
              <button type="button" class="view-arrow prev" id="prev-map" aria-label="Previous map"><i data-icon="left" data-size="30"></i></button>
              <button type="button" class="view-arrow next" id="next-map" aria-label="Next map"><i data-icon="right" data-size="30"></i></button>
              <div class="view-bottom">
                <button type="button" class="view-btn" id="movement" aria-pressed="false"><span data-state>Start</span> <span class="lg">Dynamic </span>Preview</button>
                <div class="view-actions">
                  <button type="button" class="view-btn" id="import">Share<span class="lg"> or Import</span><span class="sm"> / Import</span></button>
                  <button type="button" class="view-btn" id="undo" disabled>Undo<span class="lg"> Changes</span></button>
                  <button type="button" class="view-btn" id="reset">Reset</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="code-strip">
          <label for="share-code">Share Code</label>
          <input id="share-code" readonly spellcheck="false">
          <button type="button" class="box-btn" id="copy"><i data-icon="copy" data-size="16"></i>Copy</button>
          <button type="button" class="box-btn" id="download"><i data-icon="download" data-size="16"></i>.cfg</button>
        </div>
        <div class="settings-scroll" id="settings-scroll" role="region" aria-label="Crosshair settings" tabindex="0"><div id="settings"></div></div>
      </div>
      <footer class="editor-foot">
        <button type="button" class="foot-btn" id="random"><i data-icon="shuffle" data-size="30"></i>Randomize</button>
      </footer>
    </section>

    <section id="case-page" class="page case-page" aria-labelledby="case-title" hidden>
      <h1 class="sr-only" id="case-title">Series 1 Case</h1>
      <div class="case-runway">
        <div class="case-stage" id="case-stage">
          <div class="reel" id="reel" aria-hidden="true"><div class="reel-layer"><div class="reel-track"></div></div><div class="needle"></div></div>
          <div class="reward" id="reward" aria-live="polite" hidden></div>
        </div>
        <div class="opening-controls"><strong class="case-name">Series 1 Case</strong><div id="case-actions"></div></div>
        <div class="chance-list" id="chance-list"></div>
      </div>
    </section>
  </main>

  <dialog id="dialog" class="modal" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
